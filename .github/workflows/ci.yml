name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  check:
    name: test-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: git ls-files '*.js' | grep -v '\.min\.js$' | xargs -n1 node --check

      - name: Smoke test
        run: |
          node app.js > server.log 2>&1 &

          curl --retry 10 --retry-delay 1 --retry-connrefused -fsS -o page.html http://localhost:5506/genmodel
          grep -q "Heart Code" page.html
      
      - name: Show server log
        if: failure()
        run: cat server.log
