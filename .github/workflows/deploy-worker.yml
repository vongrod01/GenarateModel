# ===================================================================
# Deploy Worker = เอาหน้าเว็บ (โฟลเดอร์ worker/) ขึ้น Cloudflare Workers ที่ https://codegenerator.vongrod.com/gencode
#   PR เข้า main/dev  -> build + ทดสอบเท่านั้น (ไม่ deploy, ไม่แตะ secret)
#   push เข้า main    -> build + ทดสอบ แล้ว deploy ขึ้น Cloudflare แล้วลองเรียกเว็บจริงอีกรอบ
# นี่คือ CD ตัวเดียวของโปรเจ็คนี้ (เลิกทำ Docker image ขึ้น GHCR แล้ว ถ้าจะกลับมาใช้ Docker ค่อยสั่งใหม่)
#
# ---- ตอนคัดลอกไฟล์นี้ไปใช้กับโปรเจ็คอื่น ให้แก้ตรงนี้ (ค่าเฉพาะของโปรเจ็คนี้) ----
#   [ ] name: ที่บรรทัดบนสุด และ name: ของ job (ชื่อที่โผล่ใน Actions / checks ของ PR)
#   [ ] on: -> branches (PR ปลายทางไหน, push branch ไหน) และรายการ paths ทั้งสองที่ให้ตรงกัน
#   [ ] defaults.run.working-directory (โฟลเดอร์ที่มี package.json)
#   [ ] setup-node: node-version และ cache-dependency-path (ที่อยู่ของ package-lock.json)
#   [ ] คำสั่ง npm test / npm run build / npm run preview และพอร์ต preview (4173)
#   [ ] scripts/smoke.mjs และ URL เว็บจริงใน step "Smoke test (live)"
#   [ ] ชื่อ secret (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) ต้องไปสร้างใน
#       GitHub repo > Settings > Secrets and variables > Actions ของโปรเจ็คนั้นด้วย
#   [ ] concurrency group ชื่อ 'deploy-worker' (ถ้ามี workflow deploy หลายตัวในที่เดียวกัน อย่าให้ชื่อซ้ำ)
#   [ ] timeout-minutes
# ===================================================================

name: Deploy Worker

# ---------------- เมื่อไหร่ถึงจะรัน ----------------
# on: = เหตุการณ์ที่ทำให้ workflow นี้เริ่มรัน
#   pull_request + branches = PR ที่ "ปลายทาง" เป็น main หรือ dev
#   push + branches         = มีคน push (รวมถึงการ merge PR) เข้า main
#
# paths: = ตัวกรองอีกชั้น: รันก็ต่อเมื่อ "ไฟล์ที่ถูกแก้" ตรงกับรูปแบบในรายการอย่างน้อย 1 ไฟล์
#   - ต้องผ่านพร้อมกันทั้งสองเงื่อนไข: branch ตรง "และ" paths ตรง
#   - PR  = ดูไฟล์ที่เปลี่ยนทั้งหมดใน PR
#   - push = ดูไฟล์ที่เปลี่ยนในการ push/merge ครั้งนั้น
#   - แก้แต่ README หรือไฟล์นอกรายการ = ไม่รันเลย (ไม่เปลืองเวลา และไม่ deploy เปล่า ๆ)
#   - แก้ทั้งไฟล์ในรายการและนอกรายการ = รัน
#   - ** = ทุกไฟล์ในโฟลเดอร์นั้นและโฟลเดอร์ย่อยทุกชั้น, ชื่อไฟล์ตรง ๆ = เฉพาะไฟล์นั้น
#   - ครอบด้วย '...' กันสับสนกับตัวอักษรพิเศษของ YAML
#
# รายการนี้ = ทุกอย่างที่ Worker ใช้ตอน build ถ้าไฟล์เหล่านี้เปลี่ยน สิ่งที่ deploy ก็เปลี่ยนตาม
on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'worker/**'                           # โปรเจ็ค Worker เอง (src, scripts, test, config)
      - 'my_modules/generators/**'            # ตัวสร้างโค้ด ใช้ร่วมกับแอป Express และถูก bundle เข้า Worker
      - 'my_modules/be_export_file.js'        # โค้ดส่งออกไฟล์ ที่ worker/src/app.js import ไปใช้
      - 'views/**'                            # views/index.ejs ถูก render เป็นหน้า gencode.html ตอน build
      - 'public/**'                           # css/js/img ของแอป ถูกคัดลอกเป็นไฟล์ static ของ Worker
      - 'SystemConfig.json'                   # ค่า description ที่ใส่ในหน้าเว็บตอน build
      - '.github/workflows/deploy-worker.yml' # ตัว workflow เอง แก้ไฟล์นี้แล้วให้ลองรันใหม่
  push:
    branches: [main]
    # รายการ paths ด้านล่างต้องเหมือนของ pull_request ด้านบนทุกบรรทัด (แก้ที่หนึ่งต้องแก้อีกที่ให้ตรงกัน)
    paths:
      - 'worker/**'
      - 'my_modules/generators/**'
      - 'my_modules/be_export_file.js'
      - 'views/**'
      - 'public/**'
      - 'SystemConfig.json'
      - '.github/workflows/deploy-worker.yml'

# สิทธิ์ของ GITHUB_TOKEN: อ่าน repo อย่างเดียวพอ (ไม่ได้ push อะไรขึ้น GitHub)
# การ deploy ขึ้น Cloudflare ใช้ token ของ Cloudflare ต่างหาก (secrets ด้านล่าง)
permissions:
  contents: read

jobs:
  worker:
    name: build-and-deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # ทุกคำสั่ง run: ในไฟล์นี้ทำงานในโฟลเดอร์ worker/ (Worker เป็นโปรเจ็คแยกที่มี package.json ของตัวเอง)
    defaults:
      run:
        working-directory: worker

    # กัน deploy ซ้อนกัน: push เข้า main หลายรอบติดกันจะ "เข้าคิว" ทีละรอบ (ไม่ยกเลิกรอบที่กำลัง deploy)
    # ส่วน PR ให้กลุ่มไม่ซ้ำกันเลย (ใช้ run_id) เพื่อไม่ให้ไปบล็อกหรือถูกยกเลิกโดย deploy
    concurrency:
      group: ${{ github.event_name == 'push' && 'deploy-worker' || format('deploy-worker-pr-{0}', github.run_id) }}
      cancel-in-progress: false

    env:
      # ปิดการส่งสถิติการใช้งานของ cf CLI
      CF_SEND_TELEMETRY: "false"

    steps:
      # 1) ดึงโค้ดของ repo ลงมาที่เครื่อง runner
      - name: Checkout
        uses: actions/checkout@v7

      # 2) ติดตั้ง Node 22 (ได้เวอร์ชัน 22 ล่าสุด) ซึ่งต้อง >= 22.18 ตามที่ cf ต้องการ
      #    cache ใช้ worker/package-lock.json เป็นกุญแจ (ไม่ใช่ lock ของแอปเดิมที่ root)
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      # 3) ติดตั้ง dependencies ตาม lock เป๊ะ ๆ (ถ้า lock กับ package.json ไม่ตรงกัน จะ fail ทันที)
      - name: Install dependencies
        run: npm ci

      # 4) เทสต์ (node --test): routes, SQL, generators, หน้าเว็บ static ฯลฯ ไม่ต่อเน็ตและไม่ต่อ DB
      - name: Test
        run: npm test

      # 5) build: สร้างหน้าเว็บ static (gencode.html + css/js) แล้ว cf build ผลลัพธ์อยู่ที่ .cloudflare/output/v1/
      - name: Build
        run: npm run build

      # 6) Smoke test กับ build ที่เพิ่งทำ: รัน Worker จริงบน workerd (runtime เดียวกับ Cloudflare) ที่ localhost:4173
      #    smoke.mjs เช็กหน้าเว็บ, redirect, path เก่า /genmodel ต้อง 404, ไฟล์ static และ API ที่เรียกใช้ไดรเวอร์ DB
      #    --retry 15 --delay 2 = ลองซ้ำสูงสุด 15 รอบ ห่าง 2 วินาที รอให้เซิร์ฟเวอร์ลุก (แทนการ sleep ตายตัว)
      #    & ท้ายบรรทัด = รัน preview เบื้องหลัง ไม่งั้นจะค้างขั้นนี้ตลอดไป
      - name: Smoke test (preview)
        run: |
          npm run preview > preview.log 2>&1 &
          node scripts/smoke.mjs http://localhost:4173 --retry 15 --delay 2

      - name: Show preview log
        if: failure()
        run: cat preview.log

      # 7) ซ้อม deploy: ตรวจ build + config ว่าพร้อมขึ้น Cloudflare ได้ โดยไม่ส่งอะไรออกไปเลย (ไม่ต้องมี token)
      #    --prebuilt = ใช้ผล build ขั้น 5 ไม่ build ซ้ำ
      - name: Dry run deploy
        run: npx cf deploy --prebuilt --dry-run

      # ---- สองขั้นล่างทำเฉพาะตอน push เข้า main (ไม่ทำตอนเป็น PR) ----

      # 8) deploy จริง ขั้นนี้เป็นขั้นเดียวที่ได้รับ secret (token สิทธิ์น้อย ตั้งไว้ใน Settings > Secrets > Actions)
      #    PR จากที่อื่นจึงไม่มีทางเห็น token นี้
      #    ผลที่ตามมา: Cloudflare สร้าง DNS record + ใบรับรอง HTTPS ของ codegenerator.vongrod.com ให้เอง (custom domain)
      - name: Deploy to Cloudflare
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx cf deploy --prebuilt

      # 9) ลองเรียกเว็บจริงหลัง deploy: โดเมนใหม่อาจใช้เวลาสักครู่กว่า DNS/ใบรับรองจะพร้อม จึงลองซ้ำได้ถึง 30 รอบ ห่าง 5 วินาที
      - name: Smoke test (live)
        if: github.event_name == 'push'
        run: node scripts/smoke.mjs https://codegenerator.vongrod.com --retry 30 --delay 5
