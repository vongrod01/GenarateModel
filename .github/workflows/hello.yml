name: CI

on: push

jobs:
  check:
    name: test-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: git ls-files '*.js' | grep -v '\.min\.js$' | xargs -n1 node --check

      - name: Smoke test
        run: |
          node app.js > server.log 2>&1 &
          sleep 5
          curl -fsS -o page.html http://localhost:5506/genmodel
          grep -q "ไม่มีคำนี้แน่นอน" page.html
