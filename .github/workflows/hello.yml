name: Hello

on: push

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Show Node version
        run: node --version

      - name: Say hello
        run: echo "hello from GitHub Actions"

      - name: Look around
        run: ls -la